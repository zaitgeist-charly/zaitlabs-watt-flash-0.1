[project]
name = "watt-flash"
version = "0.1.0"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "transformers>=5.10", "safetensors>=0.4", "numpy>=1.26", "huggingface_hub>=0.30"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["watt_flash"]
